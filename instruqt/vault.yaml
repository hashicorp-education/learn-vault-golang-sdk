apiVersion: v1
kind: Pod
metadata:
  name: vault
  labels:
    app: vault
spec:
  containers:
  - name: vault
    image: hashicorp/vault:1.21.0
    command: ["vault"]
    args:
      - "server"
      - "-dev"
      - "-dev-tls-san=192.168.65.254"
      - "-dev-root-token-id=root"
      - "-dev-tls"
      - "-dev-tls-cert-dir=/vault/certs"
    env:
    - name: VAULT_ADDR
      value: "https://127.0.0.1:8200"
    - name: VAULT_SKIP_VERIFY
      value: "true"
    ports:
    - containerPort: 8200
      name: vault-port
      protocol: TCP
    volumeMounts:
    - name: certs
      mountPath: /vault/certs
  volumes:
  - name: certs
    hostPath: 
      path: /vault/certs

